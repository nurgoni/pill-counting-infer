name: Build and Deploy to Vertex AI

on:
  push:
    branches:
      - dev
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: PILL_INFERENCE  # Add this line to specify environment
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Debug Secrets and Environment
        run: |
          echo "Checking environment..."
          echo "GITHUB_REF: $GITHUB_REF"
          echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
          echo "Testing secret availability..."
          
          # Test GCP_PROJECT_ID
          if [ -n "${{ secrets.GCP_PROJECT_ID }}" ]; then
            echo "✓ GCP_PROJECT_ID is set"
          else
            echo "✗ GCP_PROJECT_ID is missing"
          fi
          
          # Test REGION
          if [ -n "${{ secrets.REGION }}" ]; then
            echo "✓ REGION is set"
          else
            echo "✗ REGION is missing"
          fi
          
          # Test GCP_SA_KEY length
          if [ -n "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "✓ GCP_SA_KEY is set"
            echo "GCP_SA_KEY length: $(echo '${{ secrets.GCP_SA_KEY }}' | wc -c) characters"
          else
            echo "✗ GCP_SA_KEY is missing"
          fi
          
          # Validate JSON format of GCP_SA_KEY
          if echo '${{ secrets.GCP_SA_KEY }}' | jq . >/dev/null 2>&1; then
            echo "✓ GCP_SA_KEY is valid JSON"
          else
            echo "✗ GCP_SA_KEY is not valid JSON"
          fi
          
          if [ -z "${{ secrets.GCP_SA_KEY }}" ]; then
            echo "Error: Required secrets are not set"
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ secrets.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/my-app:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/my-app:${{ github.sha }}

      - name: Deploy to Vertex AI
        run: |
          IMAGE_URI=${{ secrets.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REGISTRY_REPO }}/my-app:${{ github.sha }}
          MODEL_NAME=my-model
          ENDPOINT_ID=${{ secrets.ENDPOINT_ID }}

          # Upload the model to Vertex AI
          gcloud ai models upload \
            --region=${{ secrets.REGION }} \
            --display-name=$MODEL_NAME \
            --container-image-uri=$IMAGE_URI \
            --container-predict-route=/predict \
            --container-health-route=/health

          # Get the latest model ID
          MODEL_ID=$(gcloud ai models list \
            --region=${{ secrets.REGION }} \
            --filter="displayName:$MODEL_NAME" \
            --format="value(name)" \
            --sort-by=~updateTime \
            --limit=1)

          # Deploy the model to the endpoint
          gcloud ai endpoints deploy-model $ENDPOINT_ID \
            --region=${{ secrets.REGION }} \
            --model=$MODEL_ID \
            --display-name=my-deployed-model \
            --traffic-split=0=100